# Site config. Content itself lives in _data/*.yml (see README.md) --
# this file only holds Jekyll build settings and SEO defaults.

title: Moyank Giri
author: Moyank Giri
url: "https://moyankgiri.github.io"
timezone: "Asia/Kolkata"

markdown: kramdown
kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"

exclude:
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - DESIGN.md
  - screenshot.png
  - Appraisals

plugins:
  - jekyll-sitemap
