{%- assign s = site.data.site -%}
<section class="hero" id="top">
  <svg class="geo geo--gold" viewBox="0 0 60 60" width="60" height="60" style="top:12%; left:-20px;" aria-hidden="true"><polygon points="0,0 60,0 0,60" fill="currentColor"/></svg>
  <svg class="geo geo--green" viewBox="0 0 80 80" width="80" height="80" style="top:8%; right:-30px;" aria-hidden="true"><path d="M0 0 H80 A80 80 0 0 1 0 80 Z" fill="currentColor"/></svg>
  <svg class="geo geo--red" viewBox="0 0 40 40" width="40" height="40" style="bottom:10%; left:6%;" aria-hidden="true"><rect width="40" height="40" fill="currentColor"/></svg>
  <svg class="geo geo--gold" viewBox="0 0 60 60" width="60" height="60" style="bottom:6%; right:8%;" aria-hidden="true"><path d="M0 0 H60 A60 60 0 0 1 0 60 Z" fill="currentColor"/></svg>

  <div class="container">
    {% if s.avatar %}
    <div class="hero-avatar">
      <img src="{{ s.avatar | relative_url }}" alt="{{ s.name }}">
    </div>
    {% endif %}

    <h1>{{ s.name }}<span>{{ s.role }}</span></h1>

    <p class="hero-subtitle">{{ s.hero_subtitle }}</p>

    <div class="hero-actions">
      <a class="btn btn-primary" href="{{ s.resume_pdf | relative_url }}" target="_blank" rel="noopener">{% include icon.html name="download" %} Download résumé</a>
      <a class="btn btn-ghost" href="#contact">Get in touch</a>
    </div>

    <div class="hero-meta">
      <span>{{ s.location }}</span>
      <span>{{ s.tagline }}</span>
    </div>
  </div>
</section>
