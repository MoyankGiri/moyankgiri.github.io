{%- assign s = site.data.site -%}
<section class="hero" id="top">
  <div class="container hero-grid">
    <div class="hero-content">
      <h1>{{ s.name }}<span>{{ s.role }}</span></h1>

      <p class="hero-subtitle">{{ s.hero_subtitle }}</p>

      <div class="hero-actions">
        <a class="btn btn-primary" href="{{ s.resume_pdf | relative_url }}" target="_blank" rel="noopener">{% include icon.html name="download" %} Download résumé</a>
        <a class="btn btn-ghost" href="#contact">Get in touch</a>
      </div>

      <div class="hero-meta">
        <span>{{ s.location }}</span>
        <span>{{ s.tagline }}</span>
      </div>
    </div>

    {% if s.avatar %}
    <div class="hero-visual">
      <div class="hero-avatar">
        <img src="{{ s.avatar | relative_url }}" alt="{{ s.name }}">
      </div>
    </div>
    {% endif %}
  </div>
</section>
