<section id="skills">
  <div class="container">
    <div class="section-header">
      <div class="eyebrow">Skills</div>
      <h2>What I work with</h2>
    </div>

    {% for group in site.data.skills %}
    <div class="skill-group">
      <div class="skill-group-title">{{ group.category }}</div>
      <div class="chip-row">
        {% for item in group.items %}
        <span class="tag-pill skill-chip">
          {% if item.icon != "" %}
          <img src="https://cdn.simpleicons.org/{{ item.icon }}/4ade80" alt="" loading="lazy" onerror="this.remove()">
          {% endif %}
          {{ item.name }}
        </span>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
