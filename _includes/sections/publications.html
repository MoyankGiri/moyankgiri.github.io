<section id="publications">
  <div class="container">
    <div class="section-header">
      <h2>Publications</h2>
    </div>

    <div class="pub-list">
      {% for pub in site.data.publications %}
      <article class="pub-item">
        <div class="venue-row">
          <span>{{ pub.venue }}</span>
          <span>{{ pub.date }}</span>
        </div>
        <h3>{{ pub.title }}</h3>
        <p>{{ pub.summary }}</p>
        {% if pub.github != "" %}
        <div class="project-links">
          <a href="{{ pub.github }}" target="_blank" rel="noopener">{% include icon.html name="github" %} Source</a>
        </div>
        {% endif %}
      </article>
      {% endfor %}
    </div>
  </div>
</section>
