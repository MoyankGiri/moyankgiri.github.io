<section id="publications">
  <div class="container">
    <div class="section-header">
      <div class="eyebrow">Publications</div>
      <h2>Papers & preprints</h2>
    </div>

    <div class="card-grid">
      {% for pub in site.data.publications %}
      <article class="dark-card record-card">
        <div class="org-line">{{ pub.venue }} &middot; {{ pub.date }}</div>
        <h3>{{ pub.title }}</h3>
        <p>{{ pub.summary }}</p>
        {% if pub.github != "" %}
        <div class="record-links">
          <a class="link-outline" href="{{ pub.github }}" target="_blank" rel="noopener">Source {% include icon.html name="external" %}</a>
        </div>
        {% endif %}
      </article>
      {% endfor %}
    </div>
  </div>
</section>
