{%- assign site_data = site.data.site -%}
<header class="site-nav">
  <div class="container">
    <a href="#top" class="nav-logo">{{ site_data.name }}</a>

    <nav aria-label="Primary">
      <ul class="nav-links">
        {% for item in site_data.nav %}
        <li><a href="{{ item.href }}">{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    <div class="nav-actions">
      <div class="social-links">
        <a class="social-link" href="{{ site_data.github }}" target="_blank" rel="me noopener" aria-label="GitHub">{% include icon.html name="github" %}</a>
        <a class="social-link" href="{{ site_data.linkedin }}" target="_blank" rel="me noopener" aria-label="LinkedIn">{% include icon.html name="linkedin" %}</a>
        <a class="social-link" href="mailto:{{ site_data.email }}" aria-label="Email">{% include icon.html name="mail" %}</a>
      </div>
      <a class="btn btn-primary" href="{{ site_data.resume_pdf | relative_url }}" target="_blank" rel="noopener">Résumé</a>
      <button type="button" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">{% include icon.html name="menu" %}</button>
    </div>
  </div>
</header>
